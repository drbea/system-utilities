name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bash python3 python3-pip git
    
    - name: Run tests
      run: ./tests/test_commands.sh
    
    - name: Test install
      run: ./install.sh --force
    
    - name: Verify commands
      run: |
        create_project --version
        django_collab --version
        deploy_project --version
        backup_db --version
        check_project --version
        migrate_project --version
        run_tests --version
